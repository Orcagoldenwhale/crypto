[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smc-data"
version = "0.1.0"
description = "Binance Vision aggTrades → 5m кластерные свечи (footprint) для SMC-терминала"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "SMC Footprint Backtester" }]

# Зависимости РАНТАЙМА. Версии зафиксированы по нижней границе —
# проверять `pip install -e .` на любой версии Python 3.11+.
dependencies = [
    "pandas>=2.0,<3",
    "pydantic>=2.5,<3",
    "requests>=2.31,<3",
    "pyarrow>=15,<22",  # для parquet-кэша
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<7",
    "ruff>=0.6,<1",
]

[project.scripts]
smc-data = "smc_data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# ============================================================================
# Ruff — единый линтер + форматер.
# ============================================================================
[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# E,W — pycodestyle; F — pyflakes; I — isort; UP — pyupgrade;
# B — bugbear (catch likely bugs); SIM — упрощения; RUF — ruff-specific.
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",     # длинные строки разруливает форматер
    "RUF001",   # кириллические омографы в строках — у нас русский проект
    "RUF002",   # …то же в docstrings
    "RUF003",   # …то же в комментариях
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]  # asserts в тестах — это нормально

# ============================================================================
# Pytest — простая конфигурация.
# ============================================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"
